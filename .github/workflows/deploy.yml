# Deploys the built site to GitHub Pages. MANUAL ONLY: this workflow never runs on push.
# Start it with: Actions > Deploy to GitHub Pages > Run workflow (or `gh workflow run deploy.yml`).
# Before the first run, Settings > Pages > Source must be "GitHub Actions" (never "Deploy from a branch").
# Actions are pinned to full commit SHAs (the tag is in the comment). Permissions: read-only by default; only the
# deploy job gets pages: write and id-token: write.

name: Deploy to GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - run: npm run check:contrast
      # Fails only on critical publication blockers (secrets, personal email, broken links...)
      - run: npm run check:publish
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
